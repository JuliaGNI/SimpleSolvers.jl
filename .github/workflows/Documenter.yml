name: Documentation

on:
  push:
    branches:
      - main
    tags: "*"
  pull_request:

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install packages for generating tikz images
        # `apt-get update` first, and one `install` rather than four. Without the update the runner
        # image's package lists name whatever versions were current when it was built, and the archive
        # has since superseded some of them -- so `apt-get install` resolves a version that is no
        # longer there and fails with a 404 rather than with anything about the package it wanted.
        # `texlive-xetex` pulls in `openjdk-21-jre-headless`, which is what went stale here.
        #
        # `-y` because these run unattended. **Not** `--no-install-recommends`: `imagemagick` only
        # *recommends* `ghostscript`, and ghostscript is what lets `convert` read a PDF at all -- the
        # `docs/src/trust_region` Makefile converts `pdflatex` output to PNG, and without it `convert`
        # exits with `no images defined` rather than with anything about a missing dependency.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick poppler-utils texlive-xetex texlive-science
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Set environment variables
        run: echo "PYTHON=''" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.build()
            Pkg.precompile()'
      - name: Run doctests
        run: |
          julia --project=docs -e '
            using Documenter: doctest
            using SimpleSolvers
            doctest(SimpleSolvers)'
      - name: Build and deploy Documentation
        run: julia --project make.jl
        working-directory: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
